[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-subtitle-generator"
version = "0.1.0.dev0"
description = "Offline multilingual-to-English subtitle tools"
requires-python = ">=3.11"
dependencies = ["faster-whisper>=1.2,<2", "typer>=0.16,<1", "rich>=14,<15", "pydantic>=2,<3", "Babel>=2,<3", "srt>=3.5,<4", "webvtt-py>=0.7,<1", "fastapi>=0.162,<1", "uvicorn>=0.54,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "httpx>=0.28,<1"]

[project.scripts]
local-subs = "local_subs.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
